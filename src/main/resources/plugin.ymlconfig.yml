# ===== RISING ANTICHEAT =====

# Пороги нарушений (VL).
# cancel - ударам игрока перестаёт регистрироваться урон
# alert  - админам пишется в чат о подозрительном игроке
# check  - игрок телепортируется на точку проверки (/setcheter) и замораживается
thresholds:
  cancel: 4.0
  alert: 7.0
  check: 12.0

# На сколько VL уменьшается каждую секунду
vl-decay-per-second: 0.2

# Как часто (сек) повторять алерт по одному игроку
alert-cooldown-seconds: 15

# Не засчитывать конкретный удар, если он не прошёл проверку
cancel-failed-hits: true

# Команда бана (%player% - ник). Можно заменить на LiteBans и т.п., например: "litebans:ban %player% Читы"
ban-command: "ban %player% Читы"

# Банить игрока, если он вышел во время проверки
ban-on-quit: true

# Тексты на экране игрока на проверке
messages:
  title: "ВАШЕ ПОВЕДЕНИЕ ПОДОЗРИТЕЛЬНО"
  subtitle: "Подождите администратора"

checks:
  reach:
    max: 3.3        # макс. дистанция удара (+ поправка на пинг)
    vl: 1.5
  aura:
    expand: 0.35    # допуск прицела по хитбоксу цели
    vl: 1.0
  aim:
    snap-degrees: 55.0   # резкий поворот перед ударом
    snap-error: 2.0      # и точное попадание в центр цели (градусы)
    vl: 0.75
  multi:
    window-ms: 45        # два разных моба/игрока за это время
    vl: 2.0
  cps:
    max-hits: 15         # макс. ударов в секунду
    vl: 1.0
  wall:
    vl: 1.5              # удар сквозь блоки
  xray:
    window: 40           # сколько последних сломанных блоков смотрим
    min-veins: 3         # сколько разных жил руды в этом окне = подозрение
    max-y: 20            # проверяем только глубже этого уровня (Незер - любой)
